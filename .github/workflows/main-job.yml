on:
  workflow_call:
    # Inputs the workflow accepts.
    inputs:
      branch_name:
        description: 'Branch to checkout when tests are manually triggered'
        required: false
        type: string
        default: 'toto'

      code_coverage:
        description: 'Code coverage'
        required: false
        default: true
        type: boolean

      BUILD_GENERATOR:
        required: false
        type: string
        default: 'Ninja'

      OS:
        type: string
        default: 'ubuntu-22.04'

jobs:
  test-os:
    runs-on: ${{ inputs.OS }}
    steps:
      - name: test_if
        run: |
          if ${{ matrix.os == 'ubuntu-20.04' && inputs.code_coverage == true }}; then
            echo  " Code cov ? ${{ inputs.code_coverage }} "
          else
            echo " if is false "
          fi
        shell: bash

      - uses: actions/checkout@v2


      - name: Test optionnal var filling
        run: |
          script_args=()
          if [[ -n "${{ inputs.BUILD_GENERATOR }}" ]]; then
            BUILD_GENERATOR="${{ inputs.BUILD_GENERATOR }}"
            script_args+=(--build-generator "'${BUILD_GENERATOR}'")
            echo "Script   ${script_args[@]}"
            echo "Script3   '${script_args[*]}'"
            echo "Script2   '${script_args[@]}'"
          else
            echo "Empty var ${{ inputs.BUILD_GENERATOR }}"
            echo "Script   '${script_args[*]}'"
          fi
          ./src/script.sh '${script_args[@]}'
        shell: bash

      - name: test flag accu - step 1
        if: (matrix.os == 'ubuntu-20.04')
        run: |
          echo "C_FLG=-DMMG_COMPARABLE_OUTPUT" >> "$GITHUB_ENV"
          echo "C_FLG_PROF=-fprofile-arcs -ftest-coverage" >> "$GITHUB_ENV"


      - name: test flag accu - step 2
        if: ${{ env.C_FLG || env.C_FLG_PROF }}
        run: |
          echo "CMAKE_C_FLG=-DCMAKE_C_FLAGS=\"${{ env.C_FLG }} ${{ env.C_FLG_PROF }}\"" >> "$GITHUB_ENV"

      - uses: actions/checkout@v2

      - name: test flag accu - output
        run: |
          cmake  --version -DCMAKE_C_FLAGS="${{ env.C_FLG }} ${{ env.C_FLG_PROF }}"
          cmake  --version ${{ env.CMAKE_C_FLG }}


      - name: Install VTK
        if: matrix.vtk == 'on'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvtk7-dev
          
      - name: Install Sctoch
        if: matrix.scotch == 'on'
        run: |
          git clone https://gitlab.inria.fr/scotch/scotch.git && cd scotch
          git checkout v6.1.3
          cd src && cp Make.inc/Makefile.inc.x86-64_pc_linux2 Makefile.inc
          make scotch -j "$NJOBS"
          make install scotch -j "$NJOBS"
        env:
          NJOBS: "2"

      - name: Install LibCommons
        if: matrix.elas == 'on'
        run: |
          git clone https://github.com/ISCDtoolbox/Commons.git && cd Commons
          mkdir build
          cd build && cmake ..
          make install
          
      - name: Install LinearElasticity
        if: matrix.elas == 'on'
        run: |
          git clone https://github.com/ISCDtoolbox/LinearElasticity.git && cd LinearElasticity
          mkdir build
          cd build && cmake ..
          make install
